<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Plant Guardian</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body >
<!-- Navbar -->
<header class="navbar" id="navbar">
  <!-- Left side: Logo -->
  <div class="navbar-left">
  <a href="/" class="logo">
    <img src="/static/logo.png" alt="CropCare Logo" class="logo-icon" />
    <span class="logo-text">CROPCARE</span>
  </a>
</div>


  <!-- Hamburger Icon for Mobile -->
  <div class="hamburger" onclick="toggleMenu()">
    &#9776;
  </div>

  <!-- Right side: Nav + User Icon -->
  <div class="navbar-right" id="navbarMenu">
    <nav class="nav-links">
      <a href="/">HOME</a>
      <a href="/about">ABOUT</a>
      {% if current_user.is_authenticated %}
        <a href="/upload">DIAGNOSE</a>
        <a href="/plantcare">PLANTCARE</a>
        <a href="/techniques">TECHNIQUES</a>
      {% else %}
        <a href="/login">LOGIN</a>
      {% endif %}
    </nav>

    {% if current_user.is_authenticated %}
      <a href="/dashboard" class="user-icon" title="Dashboard">
        <img src="/static/user-logo.png" alt="User Dashboard" />
      </a>
    {% endif %}
  </div>
</header>


<script src="static/script.js"></script>


  <div class="login-body">
    <div class="login-container">
        <!-- Logo -->
        <div class="login-logo">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo">
        </div>

        <!-- Login Form -->
        <form method="post" class="login-form">
            <h1>Login</h1>
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log In</button>
              <p>No account? <a href="/register">Register here</a></p>
            <div class="social-login">
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-facebook"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
            </div>
            
        </form>
    </div>
  </div>
    <!-- FontAwesome for social icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</body>
</html>
