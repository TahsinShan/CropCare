<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Plant Guardian</title>
  <link rel="icon" type="image/png" href="/static/logo.png">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<!-- Navbar -->
<header class="navbar" id="navbar">
  <!-- Left side: Logo -->
  <div class="navbar-left">
  <a href="/" class="logo">
    <img src="/static/logo.png" alt="CropCare Logo" class="logo-icon" />
    <span class="logo-text">CROPCARE</span>
  </a>
</div>


  <!-- Hamburger Icon for Mobile -->
  <div class="hamburger" onclick="toggleMenu()">
    &#9776;
  </div>

  <!-- Right side: Nav + User Icon -->
  <div class="navbar-right" id="navbarMenu">
    <nav class="nav-links">
      <a href="/">HOME</a>
      <a href="/about">ABOUT</a>
      {% if current_user.is_authenticated %}
        <a href="/upload">DIAGNOSE</a>
        <a href="/plantcare">PLANTCARE</a>
        <a href="/techniques">TECHNIQUES</a>
      {% else %}
        <a href="/login">LOGIN</a>
      {% endif %}
    </nav>

    {% if current_user.is_authenticated %}
      <a href="/dashboard" class="user-icon" title="Dashboard">
        <img src="/static/user-logo.png" alt="User Dashboard" />
      </a>
    {% endif %}
  </div>
</header>
<script src="static/script.js"></script>


  <section class="hero">
    <div class="hero-content">
      <h1>Welcome, {{ current_user.username }}!</h1>
      <p>Recent Plant Health Overview:</p>

      <canvas id="dashboardChart" width="400" height="200"></canvas>



      <script>
        const ctx = document.getElementById('dashboardChart').getContext('2d');
        const dashboardChart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: {{ dates|tojson }},
            datasets: [{
              label: 'Plant Health (1=Healthy, 0=Diseased)',
              data: {{ results_numeric|tojson }},
              backgroundColor: {{ colors|tojson }},
              borderWidth: 1
            }]
          },
          options: {
            scales: { y: { beginAtZero: true, max: 1 } }
          }
        });
      </script>
    </div>
  </section>
</body>
</html>
